<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Artemis II - Joepdate</title>
  <link href="https://fonts.googleapis.com/css?family=Ubuntu+Mono:400,700" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body { margin: 0; font-family: 'Ubuntu Mono', monospace; }
    header { text-align: center; padding: 1rem; }
    .video-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      padding: 1rem;
      box-sizing: border-box;
    }
    .video-grid .video {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }
    .video-grid iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    @media (max-width: 800px) {
      .video-grid { grid-template-columns: 1fr; }
    }
    nav ul { list-style: none; padding: 0; margin: 0; display:flex; gap:12px; align-items:center; }
    nav a { text-decoration: none; color: inherit; padding: 8px; display:inline-block; }
  </style>
</head>
<body>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="stream.html">Stream</a></li>
      <li><a href="artemis-ii.html">Artemis II</a></li>
    </ul>
  </nav>

  <header>
    <h1>Artemis II</h1>
    <p>Twee YouTube livestreams — klik op fullscreen om ze groter te bekijken.</p>
  </header>

  <main>
    <section class="video-grid">
      <!-- YouTube live 1 -->
      <div class="video">
        <iframe
          src="https://www.youtube.com/embed/6RwfNBtepa4"
          title="Artemis II - Stream 1 (6RwfNBtepa4)"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>

      <!-- YouTube live 2 -->
      <div class="video">
        <iframe
          src="https://www.youtube.com/embed/m3kR2KK8TEs"
          title="Artemis II - Stream 2 (m3kR2KK8TEs)"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>
    </section>
  </main>

  <footer style="text-align:center;padding:1rem;">
    <p>&copy; 2026 Joepdate. All rights reserved.</p>
  </footer>
</body>
</html>
