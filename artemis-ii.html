<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Artemis II - Joepdate</title>
  <link href="https://fonts.googleapis.com/css?family=Ubuntu+Mono:400,700" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Achtergrond zwart en contrasterende tekst */
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
      color: #fff;
      font-family: 'Ubuntu Mono', monospace;
    }
    nav ul { list-style: none; padding: 0; margin: 0; display:flex; gap:12px; align-items:center; }
    nav a { text-decoration: none; color: #fff; padding: 8px; display:inline-block; }
    header { text-align: center; padding: 1rem; }
    .video-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      padding: 1rem;
      box-sizing: border-box;
    }
    .video { width: 100%; aspect-ratio: 16/9; background: #000; }
    .video iframe { width: 100%; height: 100%; border: 0; display: block; }
    @media (max-width: 800px) { .video-grid { grid-template-columns: 1fr; } }

    /* Knoppen */
    .controls {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      display:flex;
      gap: 0.5rem;
      z-index: 9999;
      flex-wrap: wrap;
    }
    .btn {
      background: rgba(255,255,255,0.12);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.18);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      font-family: 'Ubuntu Mono', monospace;
      font-size: 14px;
    }

    /* Fullscreen styles */
    body.fullscreen-mode {
      overflow: hidden;
    }
    body.fullscreen-mode nav,
    body.fullscreen-mode header,
    body.fullscreen-mode footer {
      display: none;
    }
    body.fullscreen-mode main {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
    }
    body.fullscreen-mode .video-grid {
      width: 100%;
      height: 100%;
      padding: 0;
      gap: 0;
      margin: 0;
    }
    body.fullscreen-mode .video {
      aspect-ratio: auto;
      width: 50%;
      height: 100%;
    }
    @media (max-width: 800px) {
      body.fullscreen-mode .video {
        width: 100%;
        height: 50%;
      }
    }
  </style>
</head>
<body>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="stream.html">Stream</a></li>
      <li><a href="artemis-ii.html">Artemis II</a></li>
    </ul>
  </nav>

  <header>
    <h1>Artemis II</h1>
    <p>Twee YouTube livestreams — autoplay (gemute) en knoppen om geluid en fullscreen te beheren.</p>
  </header>

  <main>
    <section class="video-grid">
      <div class="video" id="player1-container">
        <iframe id="player1"
          src="https://www.youtube.com/embed/6RwfNBtepa4?autoplay=1&mute=1&playsinline=1&enablejsapi=1"
          title="Artemis II - Stream 1"
          allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>

      <div class="video" id="player2-container">
        <iframe id="player2"
          src="https://www.youtube.com/embed/nfhDuOHMp0A?si=EbgmJJzOYkUtJ1Wj?autoplay=1&mute=1&playsinline=1&enablejsapi=1"
          title="Artemis II - Stream 2"
          allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>
    </section>
  </main>

  <footer style="text-align:center;padding:1rem;">
    <p>&copy; 2026 Joepdate. All rights reserved.</p>
  </footer>

  <div class="controls">
    <button id="fullscreenBtn" class="btn">⛶ Fullscreen</button>
    <button id="unmuteAll" class="btn">🔊 Unmute</button>
    <button id="muteAll" class="btn">🔇 Mute</button>
  </div>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player1, player2;
    function onYouTubeIframeAPIReady() {
      player1 = new YT.Player('player1', {});
      player2 = new YT.Player('player2', {});
    }

    // Fullscreen knop
    document.getElementById('fullscreenBtn').addEventListener('click', function() {
      document.body.classList.toggle('fullscreen-mode');
      const isFullscreen = document.body.classList.contains('fullscreen-mode');
      this.textContent = isFullscreen ? '⛶ Exit Fullscreen' : '⛶ Fullscreen';
    });

    // Unmute knop
    document.getElementById('unmuteAll').addEventListener('click', function() {
      if (player1 && player1.unMute) { player1.unMute(); player1.playVideo(); }
      if (player2 && player2.unMute) { player2.unMute(); player2.playVideo(); }
    });

    // Mute knop
    document.getElementById('muteAll').addEventListener('click', function() {
      if (player1 && player1.mute) { player1.mute(); }
      if (player2 && player2.mute) { player2.mute(); }
    });

    // ESC toets: fullscreen afsluiten
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && document.body.classList.contains('fullscreen-mode')) {
        document.body.classList.remove('fullscreen-mode');
        document.getElementById('fullscreenBtn').textContent = '⛶ Fullscreen';
      }
    });
  </script>
</body>
</html>
