<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artemis II Mission</title>
    <style>
        body { font-family: Arial, sans-serif; }
        #clock {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(0, 255, 0, 0.8);
            color: blue;
            padding: 10px;
            border-radius: 5px;
            font-size: 24px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="clock"></div>

    <script>
        const missionStart = new Date('2025-11-01T00:00:00-06:00'); // Houston Time
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerHTML = `<div>Current Houston Time: ${now.toLocaleString('en-US', {timeZone: 'America/Chicago'})}</div>`;
            const elapsedSeconds = Math.floor((now - missionStart) / 1000);
            document.getElementById('clock').innerHTML += `<div>Mission Elapsed Time: ${elapsedSeconds} seconds</div>`;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
